[project]
name = "local-recommender"
version = "0.1.0"
description = "Deterministic item-item collaborative recommendations with no runtime dependencies"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [{ name = "Forgeline Labs" }]
dependencies = []

[project.optional-dependencies]
dev = [
    "pytest==9.0.3",
    "ruff==0.15.22",
]

[tool.pytest.ini_options]
minversion = "9.0"
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]

[tool.ruff.format]
quote-style = "double"
